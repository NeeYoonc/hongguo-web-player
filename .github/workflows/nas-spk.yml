name: build-nas-spk

# 红果短剧 → 群晖 DSM 7 套件
#   两个包：hongguoweb（Web 客户端，强制依赖 ffmpeg-static）+ ffmpeg-static（静态 ffmpeg/ffprobe）
#   workflow_dispatch：手动出包（版本 1.0.0-<run_number>）
#   push tag nas-v*：出包并发布 GitHub Release（版本取 tag 去掉 nas-v 前缀）
on:
  workflow_dispatch:
  push:
    tags:
      - 'nas-v*'

permissions:
  contents: write

jobs:
  build-hongguoweb:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            goarch: amd64
          - arch: armv8
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/nas-v* ]]; then
            v="${GITHUB_REF#refs/tags/nas-v}"
          else
            v="1.0.0-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "version = ${v}"

      - name: Build server (linux/${{ matrix.goarch }})
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p .nas-build/bin .nas-build/web
          cd server
          go build -trimpath -buildvcs=false -ldflags '-s -w' -o ../.nas-build/bin/hongguoweb .

      - name: Download ffmpeg-core.wasm
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --connect-timeout 20 --max-time 300 --retry 2 --retry-all-errors --retry-delay 5 \
                 -o .nas-build/web/ffmpeg-core.wasm \
                 https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm; then
              ok=1; break
            fi
            echo "ffmpeg-core.wasm 下载失败（第 $i 次），10s 后重试"; sleep 10
          done
          if [ "$ok" != "1" ]; then
            rm -f .nas-build/web/ffmpeg-core.wasm
            echo "::warning::ffmpeg-core.wasm 下载失败，本次不内置（浏览器直连播放不可用）"
          fi
          ls -lh .nas-build/web/ffmpeg-core.wasm || true

      - name: Pack hongguoweb SPK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PKG=hongguoweb \
          ARCH="${{ matrix.arch }}" \
          VERSION="${VERSION}" \
          BIN=".nas-build/bin/hongguoweb" \
          WASM=".nas-build/web/ffmpeg-core.wasm" \
          bash nas/pack-spk.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spk-hongguoweb-${{ matrix.arch }}
          path: dist/hongguoweb_*.spk
          retention-days: 14

  build-ffmpeg-static:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            ffmpeg_asset: amd64
          - arch: armv8
            ffmpeg_asset: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/nas-v* ]]; then
            v="${GITHUB_REF#refs/tags/nas-v}"
          else
            v="1.0.0-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "version = ${v}"

      - name: Download static ffmpeg (${{ matrix.ffmpeg_asset }})
        run: |
          mkdir -p ".nas-build/ffmpeg/${{ matrix.ffmpeg_asset }}"
          url="https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-${{ matrix.ffmpeg_asset }}-static.tar.xz"
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --connect-timeout 30 --max-time 600 --retry 2 --retry-all-errors --retry-delay 10 \
                 -o /tmp/ffmpeg.tar.xz "$url"; then
              ok=1; break
            fi
            echo "静态 ffmpeg 下载失败（第 $i 次），15s 后重试"; sleep 15
          done
          [ "$ok" = "1" ] || { echo "::error::静态 ffmpeg 下载失败（ffmpeg-static 包必需）"; exit 1; }
          tar -xJf /tmp/ffmpeg.tar.xz -C ".nas-build/ffmpeg/${{ matrix.ffmpeg_asset }}" --strip-components=1
          ls -lh ".nas-build/ffmpeg/${{ matrix.ffmpeg_asset }}/ffmpeg" \
                 ".nas-build/ffmpeg/${{ matrix.ffmpeg_asset }}/ffprobe"

      - name: Pack ffmpeg-static SPK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PKG=ffmpeg-static \
          ARCH="${{ matrix.arch }}" \
          VERSION="${VERSION}" \
          FFMPEG_DIR=".nas-build/ffmpeg/${{ matrix.ffmpeg_asset }}" \
          bash nas/pack-spk.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spk-ffmpeg-static-${{ matrix.arch }}
          path: dist/ffmpeg-static_*.spk
          retention-days: 14

  release:
    needs: [build-hongguoweb, build-ffmpeg-static]
    if: startsWith(github.ref, 'refs/tags/nas-v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.spk
          generate_release_notes: true
          append_body: true
          body: |
            ## 红果短剧 · 群晖 DSM 7 套件

            **安装顺序（必须先装依赖）**
            1. `ffmpeg-static_<arch>-*.spk` —— 静态 ffmpeg/ffprobe（前置依赖）
            2. `hongguoweb_<arch>-*.spk` —— Web 客户端（INFO 里 `install_dep_packages="ffmpeg-static"`，未装依赖会被拒绝安装）

            架构：`x86_64`（DS923+ 等 Intel/AMD）/ `armv8`（ARM64 机型）
            端口：默认 8788，安装向导可改；数据在 `/var/packages/hongguoweb/var`，升级保留。
