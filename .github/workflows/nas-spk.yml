name: build-nas-spk

# 红果短剧 → 群晖 DSM 7 套件（SPK）
#   依赖套件源里现成的 SynoCommunity FFmpeg（默认 ffmpeg7），不内置 ffmpeg；
#   INFO 写 install_dep_packages → 未装依赖时套件中心拒绝安装。
#   workflow_dispatch：手动出包（版本 1.0.0-<run_number>）
#   push tag nas-v*：出包并发布 GitHub Release（版本取 tag 去掉 nas-v 前缀）
on:
  workflow_dispatch:
  push:
    tags:
      - 'nas-v*'

permissions:
  contents: write

env:
  # 依赖的 ffmpeg 套件名（可改 ffmpeg8 / ffmpeg6 / ffmpeg5 / ffmpeg）
  DEP_PKG: ffmpeg7

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            goarch: amd64
          - arch: armv8
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/nas-v* ]]; then
            v="${GITHUB_REF#refs/tags/nas-v}"
          else
            v="1.0.0-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "version = ${v}"

      - name: Build server (linux/${{ matrix.goarch }})
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p .nas-build/bin .nas-build/web
          cd server
          go build -trimpath -buildvcs=false -ldflags '-s -w' -o ../.nas-build/bin/hongguoweb .

      - name: Build sidecar hg-resolve (App v5 取流)
        env:
          ARCH_NAME: ${{ matrix.arch }}
        run: |
          # x86_64：本机 musl-tools 直接编；armv8：用 cross（Docker）编 aarch64-musl
          if [ "$ARCH_NAME" = "x86_64" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq musl-tools
            TARGET=x86_64-unknown-linux-musl OUT=.nas-build/bin/hg-resolve CROSS=0 bash nas/build-sidecar.sh
          else
            if ! TARGET=aarch64-unknown-linux-musl OUT=.nas-build/bin/hg-resolve CROSS=1 bash nas/build-sidecar.sh; then
              echo "::warning::armv8 侧车构建失败，本次 armv8 包不含 App 取流回落"
            fi
          fi

      - name: Download ffmpeg-core.wasm
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --connect-timeout 20 --max-time 300 --retry 2 --retry-all-errors --retry-delay 5 \
                 -o .nas-build/web/ffmpeg-core.wasm \
                 https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm; then
              ok=1; break
            fi
            echo "ffmpeg-core.wasm 下载失败（第 $i 次），10s 后重试"; sleep 10
          done
          if [ "$ok" != "1" ]; then
            rm -f .nas-build/web/ffmpeg-core.wasm
            echo "::warning::ffmpeg-core.wasm 下载失败，本次不内置（浏览器直连播放不可用）"
          fi
          ls -lh .nas-build/web/ffmpeg-core.wasm || true

      - name: Setup Node (npm，用于安装弹幕组件依赖)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pack SPK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          NPM_REGISTRY: https://registry.npmjs.org
        run: |
          ARCH="${{ matrix.arch }}" \
          VERSION="${VERSION}" \
          DEP_PKG="${DEP_PKG}" \
          BIN=".nas-build/bin/hongguoweb" \
          WASM=".nas-build/web/ffmpeg-core.wasm" \
          SIDECAR=".nas-build/bin/hg-resolve" \
          bash nas/pack-spk.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spk-${{ matrix.arch }}
          path: dist/hongguoweb_*.spk
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/nas-v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.spk
          generate_release_notes: true
          append_body: true
          body: |
            ## 红果短剧 · 群晖 DSM 7 套件

            **前置依赖**：先在套件中心「社群」里安装 **FFmpeg 7**（包名 `ffmpeg7`，SynoCommunity 提供）。
            本包 `INFO` 写有 `install_dep_packages="ffmpeg7"` —— 未装依赖时套件中心会**拒绝安装**。

            然后：套件中心 → 手动安装 → 选 `hongguoweb_<arch>-*.spk`（端口默认 8788，向导可改）。

            - 架构：`x86_64`（DS923+ 等 Intel/AMD）/ `armv8`（ARM64 机型）
            - 不内置 ffmpeg；启动时自动从 `/var/packages/ffmpeg7/target/bin` 建 shim（ffmpeg7 → ffmpeg）
            - 数据在 `/var/packages/hongguoweb/var`，升级保留；卸载向导默认保留数据
